name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
          - runner: xcode-27
            xcode: '27.0'
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Build (macOS)
        run: |
          xcodebuild -scheme Companion \
            -workspace Companion.xcodeproj/project.xcworkspace \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation \
            build

      - name: Build (iOS Simulator)
        run: |
          xcodebuild -scheme Companion \
            -workspace Companion.xcodeproj/project.xcworkspace \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation \
            build

      - name: Build (visionOS Simulator)
        run: |
          xcodebuild -scheme Companion \
            -workspace Companion.xcodeproj/project.xcworkspace \
            -destination 'generic/platform=visionOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation \
            build

      - name: Test (unit tests, macOS)
        run: |
          xcodebuild -scheme Companion \
            -workspace Companion.xcodeproj/project.xcworkspace \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation \
            test -only-testing:CompanionTests
